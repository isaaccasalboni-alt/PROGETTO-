name: Instagram Daily Post

on:
  schedule:
    - cron: "0 8 * * *"   # ogni giorno alle 09:00 ora italiana
  workflow_dispatch:
    inputs:
      topic:
        description: "Argomento (lascia vuoto per auto)"
        required: false
        default: ""

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installa font di sistema
        run: sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Installa dipendenze Python
        run: pip install -r requirements.txt

      - name: Verifica configurazione secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ ERRORE: GROQ_API_KEY non è configurata nei secrets del repository."
            echo "   Vai su: Settings → Secrets and variables → Actions → New repository secret"
            echo "   Nome: GROQ_API_KEY   Valore: la tua chiave Groq (inizia con gsk_...)"
            exit 1
          fi
          echo "✅ GROQ_API_KEY configurata correttamente"

      - name: Genera post + slide
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CONTENT_LANGUAGE: italiano
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -n "$TOPIC" ]; then
            python main.py --topic "$TOPIC"
          else
            python main.py
          fi

      - name: Salva artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 90
