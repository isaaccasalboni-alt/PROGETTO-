name: Instagram Daily Post

on:
  schedule:
    # Ogni giorno alle 09:00 ora italiana (08:00 UTC estate, 07:00 UTC inverno)
    - cron: "0 8 * * *"
  workflow_dispatch:          # ← bottone "Lancia ora" sulla pagina GitHub
    inputs:
      topic:
        description: "Argomento specifico (lascia vuoto per auto-generazione)"
        required: false
        default: ""

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Installa Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Genera post Instagram + deck Gamma
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GAMMA_API_KEY: ${{ secrets.GAMMA_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          CONTENT_LANGUAGE: italiano
        run: |
          # Ricrea il file credentials.json dal secret GitHub
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -n "$TOPIC" ]; then
            python main.py --topic "$TOPIC"
          else
            python main.py
          fi

      - name: Salva output come artifact scaricabile
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-${{ github.run_id }}
          path: logs/
          retention-days: 90
